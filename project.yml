name: SpacedOut
options:
  bundleIdPrefix: com.spacedout
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  fileTypes:
    icon:
      file: true
      buildPhase: resources

packages:
  SpacedOutLocal:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  SpacedOut:
    type: application
    platform: macOS
    sources:
      - path: Sources/SpacedOutApp
      - path: AppResources/AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacedout.app
        PRODUCT_NAME: SpacedOut
        INFOPLIST_FILE: AppResources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: AppResources/SpacedOut.entitlements
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: SpacedOutLocal
        product: SpacedOutCore

  SpacedOutCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SpacedOutCoreTests
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SpacedOutLocal
        product: SpacedOutCore
