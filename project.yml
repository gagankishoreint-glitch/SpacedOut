name: SpacedOut
options:
  bundleIdPrefix: com.spacedout
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  SpacedOutLocal:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  SpacedOut:
    type: application
    platform: macOS
    sources:
      - path: Sources/SpacedOutApp
      - path: AppResources/Assets.xcassets
    info:
      path: AppResources/Info.plist
    entitlements:
      path: AppResources/SpacedOut.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spacedout.app
        PRODUCT_NAME: SpacedOut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: SpacedOutLocal
        product: SpacedOutCore

  SpacedOutCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SpacedOutCoreTests
    dependencies:
      - package: SpacedOutLocal
        product: SpacedOutCore
